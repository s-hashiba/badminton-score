<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c8ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shuttlecock icon -->
  <!-- cork base -->
  <ellipse cx="30" cy="58" rx="10" ry="7" fill="url(#grad)" />
  <!-- feathers -->
  <line x1="30" y1="51" x2="14" y2="22" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="51" x2="22" y2="18" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="51" x2="30" y2="16" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="51" x2="38" y2="18" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="51" x2="46" y2="22" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
  <!-- feather top arc -->
  <path d="M14,22 Q30,12 46,22" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round"/>
  <path d="M17,20 Q30,14 43,20" fill="rgba(26,115,232,0.15)" stroke="none"/>

  <!-- text: バドミントンツール -->
  <text x="58" y="38" font-family="'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" fill="url(#grad)" letter-spacing="1">バドミントン</text>
  <text x="58" y="64" font-family="'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#f0f4f8" letter-spacing="3">TOOL</text>

  <!-- accent dot -->
  <circle cx="148" cy="60" r="4" fill="#00c8ff"/>
</svg>
