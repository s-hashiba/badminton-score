  <line x1="32" y1="44" x2="25" y2="15" stroke="#60aaff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="13" stroke="#60aaff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="39" y2="15" stroke="#60aaff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="46" y2="18" stroke="#60aaff" stroke-width="2" stroke-linecap="round"/>
